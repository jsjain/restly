# Every push to main and every pull request builds Restly for macOS, Windows, and Linux and keeps the
# files as run artifacts. A v* tag also publishes them as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  WAILS_VERSION: v2.15.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            platform: darwin/universal
          - name: Windows
            os: windows-2025
            platform: windows/amd64
            flags: -nsis
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
            # Ubuntu 24.04 ships WebKitGTK 4.1 only, and Wails links 4.0 without this tag.
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Wails only warns when makensis is missing, and windows-2025 does not ship NSIS.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Frontend checks
        if: runner.os == 'Linux'
        run: for check in frontend/checks/*.check.ts; do node "$check"; done

      # Failed test lines become annotations, which show on the run page without opening the log.
      - name: Go tests
        run: |
          go test -tags "${{ matrix.tags }}" ./... 2>&1 | tee go-test.log || {
            grep -E -- '_test\.go:[0-9]+:|--- FAIL' go-test.log | head -10 | sed 's/^ */::error::/'
            exit 1
          }

      - name: Build app
        run: >
          wails build -s -platform ${{ matrix.platform }} ${{ matrix.flags }}
          ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}
          -ldflags "-X main.buildCommit=${GITHUB_SHA::7} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Package
        run: |
          version=$(node -p 'require("./wails.json").info.productVersion')
          if [[ $GITHUB_REF == refs/tags/v* && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match info.productVersion $version in wails.json"
            exit 1
          fi
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              mv build/bin/restly.app build/bin/Restly.app
              codesign --force --deep --sign - build/bin/Restly.app
              ditto -c -k --keepParent build/bin/Restly.app "dist/Restly-$version-macos-universal.zip"
              ;;
            Windows)
              installer=$(ls build/bin/*installer*.exe)
              cp "$installer" "dist/Restly-$version-windows-amd64-setup.exe"
              cp build/bin/restly.exe "dist/Restly-$version-windows-amd64-portable.exe"
              ;;
            Linux)
              tar -czf "dist/Restly-$version-linux-amd64.tar.gz" -C build/bin restly
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Restly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Restly ${GITHUB_REF_NAME#v}" --generate-notes
