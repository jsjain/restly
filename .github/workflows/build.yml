# Builds Restly for macOS, Windows, and Linux when a v* tag is pushed or a release is published on
# GitHub, and attaches the files to that release. Running it by hand builds the current branch and
# keeps the files as run artifacts only.
name: Build

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "24"
  WAILS_VERSION: v2.15.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            platform: darwin/universal
          - name: Windows
            os: windows-2025
            platform: windows/amd64
            flags: -nsis
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
            # Ubuntu 24.04 ships WebKitGTK 4.1 only, and Wails links 4.0 without this tag.
            tags: webkit2_41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Wails only warns when makensis is missing, and windows-2025 does not ship NSIS.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          command -v makensis || choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Frontend checks
        if: runner.os == 'Linux'
        run: for check in frontend/checks/*.check.ts; do node "$check"; done

      # Failed test lines become annotations, which show on the run page without opening the log.
      - name: Go tests
        run: |
          go test -tags "${{ matrix.tags }}" ./... 2>&1 | tee go-test.log || {
            grep -E -- '_test\.go:[0-9]+:|--- FAIL' go-test.log | head -10 | sed 's/^ */::error::/'
            exit 1
          }

      - name: Build app
        run: >
          wails build -s -platform ${{ matrix.platform }} ${{ matrix.flags }}
          ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}
          -ldflags "-X main.buildCommit=${GITHUB_SHA::7} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Package
        run: |
          version=$(node -p 'require("./wails.json").info.productVersion')
          if [[ $GITHUB_REF == refs/tags/v* && ${GITHUB_REF_NAME#v} != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match info.productVersion $version in wails.json"
            exit 1
          fi
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              mv build/bin/restly.app build/bin/Restly.app
              codesign --force --deep --sign - build/bin/Restly.app
              ditto -c -k --keepParent build/bin/Restly.app "dist/Restly-$version-macos-universal.zip"
              ;;
            Windows)
              installer=$(ls build/bin/*installer*.exe)
              cp "$installer" "dist/Restly-$version-windows-amd64-setup.exe"
              cp build/bin/restly.exe "dist/Restly-$version-windows-amd64-portable.exe"
              ;;
            Linux)
              tar -czf "dist/Restly-$version-linux-amd64.tar.gz" -C build/bin restly
              pkg=build/deb
              install -Dm755 build/bin/restly "$pkg/usr/bin/restly"
              install -Dm644 build/appicon.png "$pkg/usr/share/pixmaps/restly.png"
              mkdir -p "$pkg/DEBIAN" "$pkg/usr/share/applications"
              printf '%s\n' "[Desktop Entry]" "Type=Application" "Name=Restly" "Comment=Desktop API client for Postman collections" \
                "Exec=restly" "Icon=restly" "Categories=Development;" "Terminal=false" > "$pkg/usr/share/applications/restly.desktop"
              # Ubuntu 24.04 renamed GTK's package in the 64-bit time_t transition, and Debian 12 did not.
              printf '%s\n' "Package: restly" "Version: $version" "Architecture: amd64" \
                "Maintainer: Shubham Jain <6463002+jsjain@users.noreply.github.com>" \
                "Depends: libgtk-3-0t64 | libgtk-3-0, libwebkit2gtk-4.1-0" "Section: devel" "Priority: optional" \
                "Homepage: https://github.com/jsjain/restly" "Description: Desktop API client for Postman collections" > "$pkg/DEBIAN/control"
              dpkg-deb --build --root-owner-group "$pkg" "dist/restly_${version}_amd64.deb"
              # Installing the package fails here if a Depends name does not exist.
              sudo apt-get install -y "./dist/restly_${version}_amd64.deb"
              test -x /usr/bin/restly
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: Restly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          # A release published on GitHub already exists. A pushed tag has none yet.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Restly ${GITHUB_REF_NAME#v}" --generate-notes
          fi
